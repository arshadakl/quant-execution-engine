{% if health %}
<div class="py-2">
  {% for name, info in health.items() %}
  <div class="flex items-center justify-between px-4 py-2 border-b border-line">
    <span class="text-[11px] tracking-[0.15em] text-ink uppercase">{{ name }}</span>
    <span class="text-[9px] tracking-[0.2em] font-semibold {{ 'text-gain' if info.healthy else 'text-loss' }}">
      {{ "OK" if info.healthy else "STALE" }}
    </span>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="py-6 text-center text-ink-d text-[11px] tracking-[0.3em]">-- NO COMPONENTS --</div>
{% endif %}
