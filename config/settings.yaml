# ─── Trading Mode ───
trading:
  mode: "paper"
  paper_capital: 100000

# ─── Risk Management ───
risk:
  max_capital_usage_percent: 60
  per_trade_risk_percent: 1.5
  max_position_size_percent: 15
  max_daily_loss_percent: 3.0
  max_daily_trades: 10
  max_open_positions: 5
  mandatory_stop_loss: true
  max_stop_loss_percent: 2.0
  trailing_stop_enabled: true
  trailing_stop_trigger_percent: 1.0
  trailing_stop_distance_percent: 0.5
  no_new_trades_after: "14:30"
  force_square_off_time: "15:10"
  no_trade_first_minutes: 3
  cooldown_after_consecutive_losses: 3
  cooldown_duration_minutes: 30

# ─── Scanner ───
scanner:
  min_volume: 500000
  min_turnover_cr: 10
  price_range: [100, 5000]
  min_atr_percent: 1.5
  max_stocks: 15
  scan_time: "08:50"

# ─── Schedule ───
schedule:
  market_open: "09:15"
  market_close: "15:30"
  scanner_run: "08:50"
  square_off_check: "15:10"

# ─── Notifications ───
notifications:
  enabled: true
  telegram:
    enabled: true
    send_on_entry: true
    send_on_exit: true
    send_daily_summary: true
    daily_summary_time: "15:35"

# ─── Strategies ───
strategies:
  active:
    - "ORB"
    - "VWAP_REVERSION"
  orb:
    opening_range_minutes: 15
    breakout_buffer_percent: 0.1
    target_multiplier: 2.0
  vwap_reversion:
    deviation_percent: 1.5
    target_multiplier: 1.5

# ─── Broker ───
broker:
  name: "angelone"
  exchange: "NSE"
  product_type: "INTRADAY"
  order_variety: "NORMAL"

# ─── Data ───
data:
  cache_dir: "data/historical"
  logs_dir: "data/logs"
  reports_dir: "data/reports"
  historical_intervals:
    - "5m"
    - "15m"
    - "1d"
